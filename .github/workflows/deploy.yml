name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm seo:generate

      - name: Test IndexNow integration
        run: node --test scripts/indexnow.test.mjs

      - run: pnpm build

      # Must run before deploy: it reads the live site's fingerprints as the baseline.
      - name: Prepare IndexNow content fingerprints
        run: node scripts/indexnow.mjs prepare

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Notify IndexNow after deployment
        run: node scripts/indexnow.mjs submit
